name: Develop Build Workflow

on:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: build-develop
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Gradle and wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Fallisce subito (prima della build Gradle) se il segreto del keystore è corrotto:
      # in caso contrario apksigner esplode dopo la build con "Tag number over 30 is not supported"
      - name: Verify keystore secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 non impostato (fork senza segreti): verifica del keystore saltata"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n' > "$RUNNER_TEMP/keystore.b64"
          base64 --decode "$RUNNER_TEMP/keystore.b64" > "$RUNNER_TEMP/keystore.p12" || {
            echo "::error::KEYSTORE_BASE64 non è base64 valido: ricaricare il segreto (output di: base64 -w0 keystore)"
            exit 1
          }
          keytool -list -keystore "$RUNNER_TEMP/keystore.p12" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1 || {
            echo "::error::Keystore illeggibile o KEYSTORE_PASSWORD errata: verificare localmente con 'keytool -list -keystore <keystore>' e ricaricare KEYSTORE_BASE64"
            exit 1
          }

      - name: Extract version name
        id: version
        run: echo "name=$(grep -oP "versionName '\K[^']+" app/build.gradle)" >> "$GITHUB_OUTPUT"

      - name: Build APKs
        run: bash ./gradlew assembleNotquitemyDebug assemblePlayDebug assembleTempoRelease

      - name: Setup build tool version variable
        shell: bash
        run: |
          BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "BUILD_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV
          echo Last build tool version is: $BUILD_TOOL_VERSION

      - name: Sign tempo release APK
        id: sign_apk
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: app/build/outputs/apk/tempo/release
          signingKey: ${{ secrets.KEYSTORE_BASE64 }}
          keyAlias: ${{ secrets.KEY_ALIAS_GITHUB }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD_GITHUB }}
          buildToolsVersion: ${{ env.BUILD_TOOL_VERSION }}

      - name: Upload Tempo signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Tempo-${{ steps.version.outputs.name }}-signed-release
          path: ${{ steps.sign_apk.outputs.signedFile }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload Notquitemy debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Notquitemy-${{ steps.version.outputs.name }}-debug
          path: app/build/outputs/apk/notquitemy/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Play debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Play-${{ steps.version.outputs.name }}-debug
          path: app/build/outputs/apk/play/debug/*.apk
          if-no-files-found: error
          retention-days: 14
