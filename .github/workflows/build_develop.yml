name: Develop Build Workflow

on:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: build-develop
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Gradle and wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Extract version name
        id: version
        run: echo "name=$(grep -oP "versionName '\K[^']+" app/build.gradle)" >> "$GITHUB_OUTPUT"

      - name: Build APKs
        run: bash ./gradlew assembleNotquitemyDebug assemblePlayDebug assembleTempoRelease

      - name: Setup build tool version variable
        shell: bash
        run: |
          BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "BUILD_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV
          echo Last build tool version is: $BUILD_TOOL_VERSION

      - name: Sign tempo release APK
        id: sign_apk
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/tempo/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS_GITHUB }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD_GITHUB }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION }}

      - name: Upload Tempo signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Tempo-${{ steps.version.outputs.name }}-signed-release
          path: ${{ steps.sign_apk.outputs.signedReleaseFile }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload Notquitemy debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Notquitemy-${{ steps.version.outputs.name }}-debug
          path: app/build/outputs/apk/notquitemy/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Play debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Play-${{ steps.version.outputs.name }}-debug
          path: app/build/outputs/apk/play/debug/*.apk
          if-no-files-found: error
          retention-days: 14
